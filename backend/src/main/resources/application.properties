
spring.application.name=srh-codeverse

spring.config.import=optional:application-secrets.properties

# DATABASE CONFIGURATION
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/srh_codeverse_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT CONFIGURATION
jwt.secret=${JWT_SECRET:SRHCodeVerse-Local-Development-Secret-Key-2026}
jwt.expiration-ms=86400000

# SERVER
server.port=${PORT:8080}

logging.level.org.springframework.security=DEBUG
logging.level.com.srhcodeverse.backend.security=DEBUG
