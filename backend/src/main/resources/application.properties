
spring.application.name=srh-codeverse

spring.config.import=optional:application-secrets.properties

# DATABASE CONFIGURATION
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/srh_codeverse_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP: conservative pool for the Aiven free-tier database.
spring.datasource.hikari.pool-name=CodeVerseHikari
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JWT CONFIGURATION
jwt.secret=${JWT_SECRET}
# Payment gateway configuration. Credentials are runtime secrets only:
# never commit real values; blank values keep payments disabled (fail closed).
payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
payment.razorpay.api-base=${RAZORPAY_API_BASE:https://api.razorpay.com/v1}
# OAuth2 Client Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.registration.google.scope=openid,profile,email

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.client-name=GitHub
spring.security.oauth2.client.registration.github.scope=user:email

spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://openidconnect.googleapis.com/v1/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com
spring.security.oauth2.client.provider.google.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs

spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=id

# OAuth success redirects to the production frontend by default. For local
# development, set FRONTEND_BASE_URL=http://localhost:5173.
app.frontend.base-url=${FRONTEND_BASE_URL:https://srh-codeverse.vercel.app}

jwt.expiration-ms=86400000

# Analytics day boundaries. Blank preserves the JVM default timezone behaviour.
codeverse.analytics.timezone=${CODEVERSE_ANALYTICS_TIMEZONE:}

# SERVER
server.port=${PORT:8080}

# Avoid verbose SQL/security logs and accidental sensitive request logging.
logging.level.org.springframework.security=WARN
logging.level.com.srhcodeverse.backend.security=WARN
logging.level.org.hibernate.SQL=WARN

# Optional trainer seed account password; leave blank to skip trainer account creation.
trainer.seed.password=${TRAINER_SEED_PASSWORD:}

# Course content is already present in the production database. Keep the large
# JSON-to-MySQL seed pass disabled during normal Render restarts/cold starts.
# Set CODEVERSE_CONTENT_SEED_ON_STARTUP=true only for a fresh/empty database,
# then disable it again after the initial seed succeeds.
codeverse.content.seed-on-startup=${CODEVERSE_CONTENT_SEED_ON_STARTUP:false}
