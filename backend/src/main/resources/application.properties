
spring.application.name=srh-codeverse

spring.config.import=optional:application-secrets.properties

# DATABASE CONFIGURATION
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/srh_codeverse_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP: conservative pool for the Aiven free-tier database.
spring.datasource.hikari.pool-name=CodeVerseHikari
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:3}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# JWT CONFIGURATION
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# SERVER
server.port=${PORT:8080}

# Avoid verbose SQL/security logs and accidental sensitive request logging.
logging.level.org.springframework.security=WARN
logging.level.com.srhcodeverse.backend.security=WARN
logging.level.org.hibernate.SQL=WARN

# Optional trainer seed account password; leave blank to skip trainer account creation.
trainer.seed.password=${TRAINER_SEED_PASSWORD:}
