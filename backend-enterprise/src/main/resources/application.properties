spring.application.name=srh-codeverse-workspaces
server.port=8081

# CORS allowed origins for the React + Vite frontend
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:5173}

# MySQL DataSource (override via environment variables in production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/srh_codeverse?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Controlled, opt-in bootstrap for the initial SUPER_ADMIN account (never hardcoded)
app.super-admin.bootstrap-email=${SUPER_ADMIN_BOOTSTRAP_EMAIL:}
app.super-admin.bootstrap-password=${SUPER_ADMIN_BOOTSTRAP_PASSWORD:}
app.super-admin.bootstrap-name=${SUPER_ADMIN_BOOTSTRAP_NAME:Platform Super Admin}

# Authentication rate limiting
app.security.rate-limit.max-attempts=${AUTH_RATE_LIMIT_MAX_ATTEMPTS:10}
app.security.rate-limit.window-seconds=${AUTH_RATE_LIMIT_WINDOW_SECONDS:900}

# Integrated deployment: enterprise workspace API runs separately from the Student API.
# Set APP_CORS_ALLOWED_ORIGINS to your frontend origin in production.
