name: SRH CodeVerse backend health ping

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Ping Render backend health endpoint
        run: |
          URL="https://srh-codeverse-backend.onrender.com/actuator/health"

          for attempt in 1 2 3; do
            echo "Health check attempt $attempt of 3"

            if curl --fail --silent --show-error \
              --connect-timeout 20 \
              --max-time 120 \
              "$URL"; then
              echo "Backend health check successful!"
              exit 0
            fi

            echo "Attempt $attempt failed."

            if [ "$attempt" -lt 3 ]; then
              sleep 10
            fi
          done

          echo "Backend health check failed after 3 attempts."
          exit 1
