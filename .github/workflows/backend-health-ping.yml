name: SRH CodeVerse backend health ping

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping Render backend liveness endpoint
        run: |
          URL="https://srh-codeverse-backend.onrender.com/api/health/live"
          for attempt in 1 2 3; do
            echo "Liveness check attempt $attempt of 3"
            if curl --fail --silent --show-error --connect-timeout 15 --max-time 90 "$URL"; then
              echo
              echo "Backend liveness endpoint responded."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          echo "Backend did not respond after 3 bounded attempts."
          exit 1
