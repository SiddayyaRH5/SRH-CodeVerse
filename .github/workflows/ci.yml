name: SRH CodeVerse CI

on:
  push:
    branches: [main, master, develop]
  paths:
    - 'frontend/**'
    - 'backend/**'
    - 'scripts/**'
    - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeverse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit and component tests
        working-directory: frontend
        run: npm test -- --reporter=dot
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Static stage verifiers
        run: |
          node scripts/verify-foundation.mjs
          node scripts/verify-stage-3-4.mjs
          node scripts/verify-stage-5.mjs
          node scripts/verify-stages-5-6.mjs
          node scripts/verify-stage-7-8.mjs
          node scripts/verify-stage-9.mjs
          node scripts/verify-stage-10.mjs
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend tests
        working-directory: backend
        run: ./mvnw -B test
